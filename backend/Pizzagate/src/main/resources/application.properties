spring.application.name=Pizzagate
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pizzagate?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pizzauser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pizzapass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.security.max-request-bytes=${APP_MAX_REQUEST_BYTES:1048576}
app.security.rate-limit.requests-per-minute=${APP_RATE_LIMIT_REQUESTS_PER_MINUTE:120}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8090/realms/pizzagate}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:8090/realms/pizzagate/protocol/openid-connect/certs}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.max-http-request-header-size=16KB
