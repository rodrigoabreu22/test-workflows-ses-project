# Pizzagate perimeter reverse proxy (Nginx + ModSecurity v3 + OWASP CRS v4)
#
# This file is mounted into the owasp/modsecurity-crs:nginx-alpine image as
# /etc/nginx/templates/conf.d/default.conf.template, replacing the image's
# stock single-backend template. The image's entrypoint runs `envsubst` on it
# at container start — but only variable names that match an actual *exported
# environment variable* get substituted, so plain Nginx variables such as
# $host, $remote_addr, $binary_remote_addr, $request_uri and
# $proxy_add_x_forwarded_for are passed through untouched (no collision with
# any UPPER_CASE env var defined for this container).
#
# ModSecurity itself is switched on globally by the image's own
# conf.d/modsecurity.conf (rendered from its stock template) — we do not need
# to (and must not) repeat `modsecurity on;` here.
#
# Internal listen ports follow the image's defaults (8080/8443): the container
# runs as the unprivileged `nginx` user and cannot bind <1024. Host-side port
# mapping is done in docker-compose.yml.

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=frontend_zone:10m rate=30r/s;

# Return 429 (Too Many Requests) instead of the default 503 when a
# limit_req zone above rejects a request.
limit_req_status 429;

# Plain HTTP — redirect everything to HTTPS (TLS termination happens here, at
# the perimeter, not in the application containers).
server {
    listen 8080 default_server;
    server_name localhost;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/conf/server.crt;
    ssl_certificate_key /etc/nginx/conf/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;

    # Perimeter-level request size limit — defence in depth alongside the
    # application's own MaxRequestSizeFilter.
    client_max_body_size 1m;

    # Security headers added at the perimeter (complement, not replace, the
    # headers Spring Security already sets on the backend — see Gap 4 in the
    # plan: the backend has no CSP, so the WAF is the right place to add one).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    server_tokens off;

    # --- Backend API -----------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;

        proxy_http_version 1.1;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
    }

    # OpenAPI / Swagger UI (served by the backend, public read-only docs)
    location ~ ^/(v3/api-docs|swagger-ui) {
        limit_req zone=api_zone burst=50 nodelay;

        proxy_http_version 1.1;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Identity Provider (Keycloak) -------------------------------------
    # Routed through the WAF so the SPA reaches it as a same-origin HTTPS
    # endpoint. Without this, the SPA (served at https://localhost) would have
    # to fetch() Keycloak's token/refresh/logout endpoints at its own plain
    # http://localhost:8090 address — browsers categorically block that as
    # "mixed content" (no CSP can override it), surfacing as a JS
    # `TypeError: Failed to fetch` right after the user authenticates. Routing
    # through here makes Keycloak same-origin (https://localhost/realms/...),
    # AND brings the IdP itself under ModSecurity/TLS/rate-limiting — the most
    # security-critical component in the system was previously the only one
    # NOT sitting behind the perimeter. See perimeter/README.md "Tuning log".
    #
    # Keycloak must be told (via KC_HOSTNAME + KC_PROXY_HEADERS in
    # docker-compose.yml) that its public identity is now https://localhost,
    # so the URLs/issuer it embeds in tokens and discovery documents match
    # what arrives here — otherwise token validation on the backend
    # (OAUTH2_ISSUER_URI) and the SPA's `iss` checks would mismatch.
    location /realms/ {
        limit_req zone=api_zone burst=50 nodelay;

        proxy_http_version 1.1;
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Keycloak's login-page theme assets (CSS/JS/images) referenced by the
    # /realms/.../protocol/openid-connect/auth pages proxied above — needed so
    # the hosted login form the user is redirected to actually renders.
    location /resources/ {
        limit_req zone=frontend_zone burst=60 nodelay;

        proxy_http_version 1.1;
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # WAF/proxy liveness probe — bypasses ModSecurity content inspection cost
    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # --- Frontend (SPA) ---------------------------------------------------
    # Static asset server (no WebSocket upgrade support needed), so the
    # Upgrade/Connection headers are deliberately not forwarded here — see
    # https://sg.run/ploZ (Nginx H2C smuggling via forwarded Upgrade headers).
    location / {
        limit_req zone=frontend_zone burst=60 nodelay;

        proxy_http_version 1.1;
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
