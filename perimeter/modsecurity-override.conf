# OWASP CRS tuning log — Pizzagate perimeter WAF
#
# This file is mounted read-only into the owasp/modsecurity-crs:nginx-alpine
# image at /etc/nginx/modsecurity.d/modsecurity-override.conf. At container
# start, 90-copy-modsecurity-config.sh stages it into
# /etc/modsecurity.d/modsecurity-override.conf, which is Include'd by
# setup.conf AFTER modsecurity.conf but BEFORE the CRS rule files — the
# correct position for SecRuleUpdateTargetById / SecRuleRemoveById exclusions
# (CRS docs call this the "before-crs" customization point).
#
# Rule of thumb for this project: do NOT disable a rule wholesale. Narrow the
# exclusion to the exact request element that produces the false positive, and
# record the rule ID + reason here so it can be cited 1:1 in the Part 2 report
# ("tuning performed and the false positives it eliminated").
#
# Entries are added incrementally as Phase 1/2 testing reveals real false
# positives — see perimeter/README.md "Tuning log" for the running narrative.
#
# ---------------------------------------------------------------------------
# Entry 1 — false positive on the OIDC redirect callback (`iss` parameter)
# ---------------------------------------------------------------------------
# Symptom: browser-based Keycloak login returned a WAF "403 Forbidden" page
# instead of landing back on the SPA, immediately after the user authenticated
# at Keycloak and was redirected to https://localhost/?state=...&code=...
#
# Root cause (from /var/log/modsec_audit.log; first seen as unique_id
# 178093896037.444070 against rule 934110, when the issuer was still
# `http://localhost:8090/realms/pizzagate`; reappeared against the sibling
# rule 934190 once Keycloak was moved behind the WAF — see entry 2 below —
# and its issuer URL changed shape to `https://localhost/realms/pizzagate`,
# a value the OTHER SSRF rule's dataset also flags):
#   CRS's SSRF rules (934110 "Cloud provider metadata URL in Parameter" and
#   934190 "Scheme-less localhost or internal hostname detected") both treat
#   any parameter value containing "http://localhost" / "localhost/" as a
#   possible SSRF probe. Keycloak's OIDC redirect legitimately includes
#   `iss=<our issuer URL>` (the RFC 9207 issuer-identification parameter, so
#   the SPA can confirm the response came from the expected authorization
#   server) — and our issuer genuinely *is* `https://localhost/realms/
#   pizzagate`, because that's our own dev Keycloak. Each match alone scores
#   5, meets BLOCKING_INBOUND_ANOMALY_SCORE >= 5, and rule 949110 blocks the
#   request — a textbook false positive: an OIDC protocol field correctly
#   naming our own issuer, which happens to be "localhost" in dev.
#
# Fix: remove ONLY `ARGS:iss` from BOTH SSRF rules' targets, and ONLY on `/`
# (the SPA's single redirect_uri / page route — see src/auth/oidc.ts
# `redirectUri`). This is the narrowest possible exclusion: both rules keep
# inspecting every other parameter, on every other path, for real SSRF
# payloads; this just stops them from distrusting the one parameter Keycloak
# itself populates with our own issuer URL on our own callback route. Must
# run in phase:1, before CRS's phase:2 rules evaluate — this file is
# Include'd at the correct point (see header comment above) for
# `ctl:ruleRemoveTargetById` to take effect.
SecRule REQUEST_FILENAME "@streq /" \
    "id:10000,\
    phase:1,\
    pass,\
    nolog,\
    msg:'Local exclusion: drop ARGS:iss from rules 934110/934190 on the OIDC redirect callback (/) — see modsecurity-override.conf entry 1',\
    ctl:ruleRemoveTargetById=934110;ARGS:iss,\
    ctl:ruleRemoveTargetById=934190;ARGS:iss"

# ---------------------------------------------------------------------------
# Entry 2 — false positive on OIDC redirect/issuer URL parameters at Keycloak
# ---------------------------------------------------------------------------
# Symptom: discovered while testing entry 1's fix end-to-end (now that
# Keycloak is routed through the WAF — see perimeter/default.conf "Identity
# Provider" location blocks, added so the SPA can reach it same-origin and
# avoid the browser's mixed-content block on cross-scheme fetch()). The very
# first request of the login flow — the SPA redirecting the browser to
# Keycloak's /auth endpoint with `redirect_uri=https://localhost/` — was
# itself blocked with a 403 before the user ever saw the login form.
#
# Root cause (audit log, unique_id 178094058787.214223):
#   Rule 934190 "Possible Server Side Request Forgery (SSRF) Attack:
#   Scheme-less localhost or internal hostname detected" matched
#   ARGS:redirect_uri because its value, `https://localhost/`, contains the
#   substring `localhost/` — which the CRS SSRF dataset treats as a possible
#   internal-hostname probe. Exactly the same class of false positive as
#   entry 1 (and the same underlying tension: our *real* dev redirect target
#   legitimately is `https://localhost/`, because that's where our own dev
#   stack runs) — just a different rule (934190 vs. 934110) and a different
#   parameter (`redirect_uri` / `post_logout_redirect_uri` vs. `iss`).
#
# These two parameters appear, by name, in exactly three Keycloak protocol
# requests the SPA makes (src/auth/oidc.ts): `redirect_uri` in the
# authorization request (/auth) and the code exchange (/token), and
# `post_logout_redirect_uri` in /logout. Scoping to those three endpoints
# (rather than e.g. blanket-removing the targets everywhere) keeps 934190
# fully active for any other parameter, on any other route, including any
# OTHER Keycloak endpoint we don't proxy and don't expect traffic on.
SecRule REQUEST_FILENAME "@rx ^/realms/pizzagate/protocol/openid-connect/(auth|token|logout)$" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    msg:'Local exclusion: drop ARGS:redirect_uri / ARGS:post_logout_redirect_uri from rule 934190 on Keycloak OIDC endpoints — see modsecurity-override.conf entry 2',\
    ctl:ruleRemoveTargetById=934190;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=934190;ARGS:post_logout_redirect_uri"

# ---------------------------------------------------------------------------
# Entry 3 — false positive blocking PUT and DELETE on the REST API
# ---------------------------------------------------------------------------
# Symptom: any PUT or DELETE request to /api/** was blocked with 403 by the
# WAF before reaching the backend, making update and delete operations
# completely unusable from the browser.
#
# Root cause (rule 911100 "Method is not allowed by policy"):
#   The OWASP CRS default allowed-methods list is `GET HEAD POST OPTIONS`.
#   PUT and DELETE are not in that list, so every pizzeria/pizza update or
#   delete issued by the SPA was rejected at the perimeter — even when the
#   caller had a valid JWT and the backend would have accepted the request.
#
# Fix: remove rule 911100 for /api/** only. The API has its own authentication
# (JWT bearer, validated on every request) and its own authorisation layer
# (permissions.csv + object-level ownership checks), so the WAF method filter
# adds no security value on this path — it only blocks legitimate traffic.
# All other paths (the SPA itself, Keycloak, etc.) still have 911100 active.
SecRule REQUEST_FILENAME "@rx ^/api/" \
    "id:10002,\
    phase:1,\
    pass,\
    nolog,\
    msg:'Local exclusion: remove method-enforcement rule 911100 on /api/** — PUT/DELETE are valid REST verbs authenticated by JWT; see modsecurity-override.conf entry 3',\
    ctl:ruleRemoveById=911100"
